<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#172033} .title{font-size:25px;font-weight:700}.sub{font-size:13px;fill:#46536a}.axis{stroke:#172033;stroke-width:2;fill:none}.grid{stroke:#d7dee8;stroke-width:1}.curve{stroke:#1d4ed8;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}.mark{fill:#dc2626;stroke:#fff;stroke-width:2}.label{font-size:16px;font-weight:700}.small{font-size:13px}.note{font-size:12px;fill:#536176}</style><defs><marker id="ray" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6Z" fill="#1d4ed8"/></marker></defs><rect width="760" height="470" fill="white"/><text x="30" y="38" class="title">2020 Physics — Question 8(b)</text><text x="30" y="62" class="sub">Compton scattering • schematic, directions are illustrative</text><circle cx="365" cy="250" r="10" fill="#dc2626"/><path d="M80 250H350" stroke="#1d4ed8" stroke-width="4" marker-end="url(#ray)"/><path d="M380 244L625 120" stroke="#1d4ed8" stroke-width="4" marker-end="url(#ray)"/><path d="M380 256L625 382" stroke="#1d4ed8" stroke-width="4" marker-end="url(#ray)"/><path d="M425 250A60 60 0 0 0 418 221" stroke="#dc2626" stroke-width="2" fill="none"/><g class="label"><text x="80" y="220">Incident photon</text><text x="500" y="100">Scattered photon</text><text x="510" y="412">Recoil electron</text><text x="420" y="225">θ</text></g><g class="small"><text x="115" y="276">wavelength λ</text><text x="520" y="142">wavelength λ′</text><text x="335" y="285">electron</text><text x="330" y="305">collision</text></g><text x="30" y="450" class="note">The photon changes direction and wavelength; the electron recoils.</text></svg>