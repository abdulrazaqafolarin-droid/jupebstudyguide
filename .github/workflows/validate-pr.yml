name: Validate pull requests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: TypeScript, tests, web and Android build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Refresh lockfile for native platform dependencies
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Validate Firebase Android client
        run: |
          test -s android/app/google-services.json
          python3 - <<'PY'
          import json
          with open("android/app/google-services.json", encoding="utf-8") as source:
              config = json.load(source)
          packages = {
              item.get("client_info", {}).get("android_client_info", {}).get("package_name")
              for item in config.get("client", [])
          }
          assert "com.jupeb.master" in packages, "Firebase config must include Android package com.jupeb.master"
          print("Firebase Android client config validated.")
          PY

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build web app
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          VITE_SUPABASE_URL: "https://gzyczowqqywesqhqqpdi.supabase.co"
          VITE_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_GVQs-O9yijr0XIbB6cVvEw_pvQyFXbX"
          VITE_SUPABASE_PROJECT_ID: "gzyczowqqywesqhqqpdi"
          VITE_ADMIN_EMAIL: "abdulrazaqafolarin@gmail.com"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Compile Android debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          (cd android && ./gradlew assembleDebug --no-daemon)
