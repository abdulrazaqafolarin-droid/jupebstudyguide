name: Daily Mission Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check application TypeScript
        run: npx tsc --noEmit -p tsconfig.app.json --pretty false && npx tsc --noEmit -p tsconfig.node.json --pretty false
      - name: Type-check service worker
        run: npx tsc --noEmit -p tsconfig.sw.json --pretty false
      - name: Run unit tests
        run: npm test -- --reporter=dot
      - name: Build production app
        run: npm run build
