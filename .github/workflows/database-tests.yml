name: Database migration tests

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/database-tests.yml"
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/database-tests.yml"

permissions:
  contents: read

jobs:
  postgres-tests:
    name: Local PostgreSQL and pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Pin to the maintained v2 CLI line so a future CLI major cannot
      # silently change this local-only test workflow.
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.122.1

      - name: Enable pg_net for local migration compatibility
        run: |
          cat >> supabase/config.toml <<'EOF'
          [experimental.webhooks]
          enabled = true
          EOF

      - name: Start an isolated local Supabase stack
        run: supabase start

      - name: Apply local migrations and run database tests
        run: supabase test db
