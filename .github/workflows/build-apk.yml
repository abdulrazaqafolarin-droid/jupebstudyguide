name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# Needed so the release step (softprops/action-gh-release) can create the
# android-latest release with GITHUB_TOKEN.
permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Capacitor 8 / AGP 8.x requires JDK 21 to compile.
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # NOTE: the action's default `packages` includes the long-removed
          # `tools` package, which makes sdkmanager exit 1. Override it.
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Install npm dependencies
        run: npm ci

      - name: Build web app
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          # Public, non-secret build values (also on Vercel). The bundled app
          # boots blank without these since Vite inlines them at build time.
          VITE_SUPABASE_URL: "https://gzyczowqqywesqhqqpdi.supabase.co"
          VITE_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_GVQs-O9yijr0XIbB6cVvEw_pvQyFXbX"
          VITE_SUPABASE_PROJECT_ID: "gzyczowqqywesqhqqpdi"
          VITE_ADMIN_EMAIL: "admin@example.com"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jupeb-master-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        # Release every main-branch build under a stable tag so the in-app
        # Download page (which reads /releases/latest) always finds an APK.
        # Version tags (v*) still get their own release notes.
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        with:
          tag_name: android-latest
          name: "Android APK (latest)"
          files: android/app/build/outputs/apk/debug/app-debug.apk
