name: Native iOS build

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: native-ios-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  ios:
    name: Configure and build Rutex Master for iOS Simulator
    runs-on: macos-26
    timeout-minutes: 45
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Check out source branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Verify Apple toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -showsdks > "$RUNNER_TEMP/available-sdks.txt"
          grep -q 'iOS' "$RUNNER_TEMP/available-sdks.txt"
          xcrun simctl list devices available

      - name: Refresh lockfile for the new native platform
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Type-check application
        run: npx tsc --noEmit -p tsconfig.app.json --pretty false && npx tsc --noEmit -p tsconfig.node.json --pretty false && npx tsc --noEmit -p tsconfig.sw.json --pretty false

      - name: Run unit tests
        run: npm test -- --reporter=dot

      - name: Build shared React application
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          VITE_SUPABASE_URL: "https://gzyczowqqywesqhqqpdi.supabase.co"
          VITE_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_GVQs-O9yijr0XIbB6cVvEw_pvQyFXbX"
          VITE_SUPABASE_PROJECT_ID: "gzyczowqqywesqhqqpdi"
          VITE_ADMIN_EMAIL: "abdulrazaqafolarin@gmail.com"

      - name: Generate Capacitor iOS platform
        run: |
          set -euo pipefail
          if [ ! -d ios/App/App.xcodeproj ]; then
            npx cap add ios
          fi

      - name: Configure iOS privacy descriptions and APNs entitlement
        run: bash scripts/configure-ios-project.sh

      - name: Sync Capacitor iOS plugins and web assets
        run: npx cap sync ios

      - name: Validate iOS project metadata
        run: |
          set -euo pipefail
          plutil -lint ios/App/App/Info.plist
          plutil -lint ios/App/App/App.entitlements
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER = com.jupeb.master;' ios/App/App.xcodeproj/project.pbxproj
          grep -q 'CODE_SIGN_ENTITLEMENTS = App/App.entitlements;' ios/App/App.xcodeproj/project.pbxproj
          grep -q 'APS_ENVIRONMENT = development;' ios/App/App.xcodeproj/project.pbxproj
          grep -q 'APS_ENVIRONMENT = production;' ios/App/App.xcodeproj/project.pbxproj
          /usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes' ios/App/App/Info.plist | grep -q 'com.jupeb.master'
          /usr/libexec/PlistBuddy -c 'Print :NSCameraUsageDescription' ios/App/App/Info.plist >/dev/null
          /usr/libexec/PlistBuddy -c 'Print :NSPhotoLibraryUsageDescription' ios/App/App/Info.plist >/dev/null
          /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' ios/App/App/Info.plist >/dev/null

      - name: Build iOS Simulator app
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/rutex-ios-derived" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify built iOS app identity
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/rutex-ios-derived/Build/Products/Debug-iphonesimulator/App.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | grep -Fx 'com.jupeb.master'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Info.plist" | grep -Fx 'Rutex Master(Jupeb)'
          echo "iOS Simulator application built and identity verified."

      - name: Install and launch on an iPhone simulator
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > "$RUNNER_TEMP/ios-devices.json"
          DEVICE_UDID="$(python3 - "$RUNNER_TEMP/ios-devices.json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as f:
              data = json.load(f)
          candidates = [
              device
              for runtime, devices in data["devices"].items()
              if runtime.startswith("com.apple.CoreSimulator.SimRuntime.iOS-")
              for device in devices
              if device.get("isAvailable") and device.get("name", "").startswith("iPhone")
          ]
          if not candidates:
              raise SystemExit("No available iPhone simulator was found")
          candidates.sort(key=lambda device: device["name"], reverse=True)
          print(candidates[0]["udid"])
          PY
          )"
          APP="$RUNNER_TEMP/rutex-ios-derived/Build/Products/Debug-iphonesimulator/App.app"
          xcrun simctl boot "$DEVICE_UDID"
          xcrun simctl bootstatus "$DEVICE_UDID" -b
          xcrun simctl install "$DEVICE_UDID" "$APP"
          xcrun simctl launch "$DEVICE_UDID" com.jupeb.master
          # A cold WKWebView may need more time than the native process launch.
          sleep 15
          xcrun simctl io "$DEVICE_UDID" screenshot "$RUNNER_TEMP/rutex-ios-boot.png"
          xcrun simctl spawn "$DEVICE_UDID" log show --last 3m --style compact --predicate 'process == "App" OR process == "WebContent" OR subsystem CONTAINS[c] "WebKit"' > "$RUNNER_TEMP/rutex-ios-runtime.log" 2>&1 || true
          xcrun simctl terminate "$DEVICE_UDID" com.jupeb.master || true

      - name: Upload simulator build and generated Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: rutex-master-ios-simulator
          path: |
            ${{ runner.temp }}/rutex-ios-derived/Build/Products/Debug-iphonesimulator/App.app
            ios/
            ${{ runner.temp }}/rutex-ios-boot.png
            ${{ runner.temp }}/rutex-ios-runtime.log
          if-no-files-found: error
          retention-days: 14

      - name: Commit generated iOS project and resolved lockfile
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ios package-lock.json
          if git diff --cached --quiet; then
            echo "iOS project and lockfile are already committed."
            exit 0
          fi
          git commit -m "Add generated native iOS project and lockfile"
          git push origin "HEAD:$BRANCH_NAME"
