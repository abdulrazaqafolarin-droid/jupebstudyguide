<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#172033} .title{font-size:25px;font-weight:700}.sub{font-size:13px;fill:#46536a}.axis{stroke:#172033;stroke-width:2;fill:none}.grid{stroke:#d7dee8;stroke-width:1}.curve{stroke:#1d4ed8;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}.mark{fill:#dc2626;stroke:#fff;stroke-width:2}.label{font-size:16px;font-weight:700}.small{font-size:13px}.note{font-size:12px;fill:#536176}</style><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#1d4ed8"/></marker></defs><rect width="720" height="470" fill="white"/><text x="30" y="38" class="title">2017 Physics — Question 2</text><text x="30" y="62" class="sub">Elliptical orbit • schematic, not to scale</text><ellipse cx="360" cy="235" rx="260" ry="145" fill="none" stroke="#1d4ed8" stroke-width="4"/><circle cx="230" cy="235" r="17" fill="#fbbf24" stroke="#a16207" stroke-width="2"/><circle cx="230" cy="235" r="7" fill="#fff7cc"/><text x="165" y="275" class="label">Sun (focus)</text><circle cx="590" cy="235" r="9" class="mark"/><text x="606" y="240" class="label">P</text><circle cx="105" cy="235" r="9" class="mark"/><text x="80" y="218" class="label">Q</text><path d="M560 335 Q360 445 145 335" fill="none" stroke="#1d4ed8" stroke-width="3" marker-end="url(#arr)"/><text x="265" y="420" class="label">P → Q: moving closer to the Sun</text><text x="30" y="455" class="note">As the asteroid approaches the Sun, its speed and kinetic energy increase.</text></svg>