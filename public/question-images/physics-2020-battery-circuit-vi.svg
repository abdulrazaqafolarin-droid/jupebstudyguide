<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172033}.title{font-size:25px;font-weight:700}.sub{font-size:13px;fill:#46536a}.axis{stroke:#172033;stroke-width:2;fill:none}.grid{stroke:#d7dee8;stroke-width:1}.line{stroke:#1d4ed8;stroke-width:4;fill:none}.label{font-size:16px;font-weight:700}.small{font-size:13px;fill:#536176}</style>
<rect width="960" height="540" fill="white"/>
<text x="28" y="38" class="title">2020 Physics Theory — Question 5</text>
<text x="28" y="62" class="sub">Official battery circuit (Fig. 2a) and terminal p.d.–current graph (Fig. 2b), redrawn from the paper description</text>
<text x="55" y="112" class="label">Fig. 2a — Circuit</text>
<!-- outer circuit -->
<path d="M90 170H135 M305 170H410V355H90V170" stroke="#172033" stroke-width="3.5" fill="none"/>
<!-- dashed battery box on the top branch -->
<rect x="135" y="132" width="170" height="76" rx="5" fill="none" stroke="#172033" stroke-width="2" stroke-dasharray="6 5"/>
<path d="M135 170H174 M190 170H220 M270 170H305" stroke="#172033" stroke-width="3"/>
<path d="M174 145V195 M190 155V185" stroke="#172033" stroke-width="3"/>
<rect x="220" y="154" width="50" height="32" fill="white" stroke="#172033" stroke-width="3"/>
<text x="169" y="125" class="label">E</text><text x="238" y="147" class="small">r</text>
<!-- ammeter left branch -->
<circle cx="90" cy="260" r="23" fill="white" stroke="#172033" stroke-width="3"/>
<text x="82" y="266" class="label">A</text>
<!-- resistor bottom branch -->
<rect x="190" y="338" width="105" height="34" fill="white" stroke="#172033" stroke-width="3"/>
<path d="M90 355H190 M295 355H410" stroke="#172033" stroke-width="3.5" fill="none"/>
<text x="202" y="329" class="label">Variable R</text>
<!-- voltmeter in parallel -->
<path d="M190 355V410H218 M295 355V410H267" stroke="#172033" stroke-width="2.5" fill="none"/>
<circle cx="242" cy="410" r="24" fill="white" stroke="#172033" stroke-width="3"/>
<text x="234" y="416" class="label">V</text>
<!-- direction current arrow -->
<path d="M385 235V185 M376 197L385 182L394 197" stroke="#1d4ed8" stroke-width="3" fill="none"/>
<text x="398" y="210" class="label">I</text>
<text x="75" y="457" class="small">Ammeter in series; voltmeter across R; battery has e.m.f. E and internal resistance r.</text>
<!-- graph -->
<text x="500" y="112" class="label">Fig. 2b — V against I</text>
<path class="axis" d="M565 395V145 M565 395H905"/>
<g class="grid">
<path d="M565 353H905 M565 311H905 M565 270H905 M565 228H905 M565 186H905 M565 145H905"/>
<path d="M650 145V395 M735 145V395 M820 145V395 M905 145V395"/>
</g>
<path class="line" d="M565 145L778 345"/>
<g class="small">
<text x="539" y="400">0</text><text x="538" y="358">1</text><text x="538" y="316">2</text><text x="538" y="275">3</text><text x="538" y="233">4</text><text x="538" y="191">5</text><text x="538" y="150">6</text>
<text x="560" y="418">0</text><text x="645" y="418">1</text><text x="730" y="418">2</text><text x="815" y="418">3</text><text x="900" y="418">4</text>
<text x="700" y="449" class="label">Current I (A)</text><text x="496" y="132" class="label">Potential difference V (V)</text>
</g>
<text x="576" y="482" class="small">Straight line: V ≈ 6.0 V at I = 0 and V ≈ 1.2 V at I = 2.5 A.</text>
</svg>