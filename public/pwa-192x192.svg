<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <rect width="192" height="192" rx="32" fill="#0D0D0D"/>
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8C36A"/>
      <stop offset="50%" style="stop-color:#D4A34C"/>
      <stop offset="100%" style="stop-color:#B8860B"/>
    </linearGradient>
  </defs>
  <!-- Book icon -->
  <rect x="40" y="50" width="112" height="92" rx="8" fill="url(#gold)"/>
  <rect x="48" y="58" width="96" height="76" rx="4" fill="#0D0D0D"/>
  <!-- Center line (book spine) -->
  <rect x="93" y="50" width="6" height="92" fill="url(#gold)"/>
  <!-- Text lines -->
  <rect x="56" y="72" width="32" height="4" rx="2" fill="url(#gold)" opacity="0.6"/>
  <rect x="56" y="84" width="28" height="4" rx="2" fill="url(#gold)" opacity="0.6"/>
  <rect x="56" y="96" width="24" height="4" rx="2" fill="url(#gold)" opacity="0.6"/>
  <rect x="104" y="72" width="32" height="4" rx="2" fill="url(#gold)" opacity="0.6"/>
  <rect x="104" y="84" width="28" height="4" rx="2" fill="url(#gold)" opacity="0.6"/>
  <rect x="104" y="96" width="24" height="4" rx="2" fill="url(#gold)" opacity="0.6"/>
  <!-- Graduation cap -->
  <polygon points="96,24 56,44 96,64 136,44" fill="url(#gold)"/>
  <rect x="92" y="44" width="8" height="16" fill="url(#gold)"/>
  <circle cx="96" cy="60" r="4" fill="#0D0D0D"/>
</svg>