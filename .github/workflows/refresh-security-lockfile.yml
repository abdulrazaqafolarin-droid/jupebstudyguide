name: Regenerate security dependency lockfile

on:
  push:
    branches:
      - fix/security-dependency-advisories

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out security branch
        uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Regenerate package lock safely
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --prefer-online
      - name: Verify lockfile changed and package tree is resolvable
        run: |
          set -euo pipefail
          node -e "const p=require('./package.json'); const l=require('./package-lock.json'); for (const k of ['pdfjs-dist','zod','katex','react-router-dom']) { if (p.dependencies[k] !== l.packages[''].dependencies[k]) throw new Error('Lockfile mismatch: '+k); }"
          git diff --check
          git diff --quiet -- package-lock.json && { echo 'Expected package-lock.json to change'; exit 1; } || true
      - name: Commit generated lockfile
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): regenerate security patch lockfile"
          git push origin HEAD
