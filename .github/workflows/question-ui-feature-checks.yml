name: Question UI feature checks

on:
  push:
    branches:
      - feat/independent-question-scroll-multi-inline-crop-2026-11-11

permissions:
  contents: read

jobs:
  validate:
    name: TypeScript, tests, lint and production web build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build web app
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          VITE_SUPABASE_URL: https://gzyczowqqywesqhqqpdi.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_GVQs-O9yijr0XIbB6cVvEw_pvQyFXbX
          VITE_SUPABASE_PROJECT_ID: gzyczowqqywesqhqqpdi
