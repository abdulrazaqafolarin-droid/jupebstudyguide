name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# Needed so the release step (softprops/action-gh-release) can create the
# android-latest release with GITHUB_TOKEN.
permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Capacitor 8 / AGP 8.x requires JDK 21 to compile.
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # NOTE: the action's default `packages` includes the long-removed
          # `tools` package, which makes sdkmanager exit 1. Override it.
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Install npm dependencies
        run: npm ci

      - name: Build web app
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          # Public, non-secret build values (also on Vercel). The bundled app
          # boots blank without these since Vite inlines them at build time.
          VITE_SUPABASE_URL: "https://gzyczowqqywesqhqqpdi.supabase.co"
          VITE_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_GVQs-O9yijr0XIbB6cVvEw_pvQyFXbX"
          VITE_SUPABASE_PROJECT_ID: "gzyczowqqywesqhqqpdi"
          VITE_ADMIN_EMAIL: "admin@example.com"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug
        env:
          # Monotonic per-workflow counter: every main-branch build gets a
          # unique versionCode so installed APKs accept in-app updates.
          APK_VERSION_CODE: ${{ github.run_number }}
          APK_VERSION_NAME: 1.1.${{ github.run_number }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jupeb-master-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        # Release every main-branch build under a stable tag so the in-app
        # Download page (which reads /releases/latest) always finds an APK.
        # Version tags (v*) still get their own release notes.
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        with:
          tag_name: android-latest
          name: "Android APK (latest)"
          files: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Mirror APK + version file to public storage
        # The installed app checks this version.json on launch to offer
        # in-app updates (the GitHub repo is private, so the app cannot
        # query releases directly). Requires a SUPABASE_SERVICE_ROLE_KEY
        # repository secret; skipped silently when absent.
        if: github.ref == 'refs/heads/main'
        env:
          SUPABASE_URL: "https://gzyczowqqywesqhqqpdi.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "No SUPABASE_SERVICE_ROLE_KEY secret — skipping public mirror."
            exit 0
          fi
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          printf '{"versionCode":%s,"versionName":"%s","commit":"%s","builtAt":"%s","url":"%s/storage/v1/object/public/app-releases/jupeb-master.apk"}' \
            "${{ github.run_number }}" "1.1.${{ github.run_number }}" "${{ github.sha }}" "$BUILT_AT" "$SUPABASE_URL" \
            > version.json
          curl -sS --fail-with-body -X POST \
            "$SUPABASE_URL/storage/v1/object/app-releases/jupeb-master.apk" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/vnd.android.package-archive" \
            -H "x-upsert: true" \
            --data-binary "@$APK"
          curl -sS --fail-with-body -X POST \
            "$SUPABASE_URL/storage/v1/object/app-releases/version.json" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "x-upsert: true" \
            --data-binary "@version.json"
