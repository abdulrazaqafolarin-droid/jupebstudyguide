name: Validate pull requests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/rutex-jamb-workspace, feat/jamb-programme-subscription-countdown-2026-11-26]

permissions:
  contents: read

jobs:
  validate:
    name: TypeScript, tests, web and Android build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Refresh lockfile for native platform dependencies
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF extraction dependency
        run: python -m pip install --disable-pip-version-check pymupdf==1.26.6

      - name: Extract committed JAMB syllabus source PDFs
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COMMIT="e1d9b81b82be717567f47972c39a6ce702bf6b92"
          SOURCE_DIR="$RUNNER_TEMP/jamb-syllabus-inputs"
          OUTPUT_DIR="$GITHUB_WORKSPACE/artifacts/jamb-syllabus"
          mkdir -p "$SOURCE_DIR"
          git fetch --no-tags --depth=1 origin "$SOURCE_COMMIT"
          for file in "Biology-1.pdf" "Chemistry-1.pdf" "Mathematics.pdf" "Physics-1.pdf" "Use of English.pdf"; do
            git show "$SOURCE_COMMIT:$file" > "$SOURCE_DIR/$file"
            test -s "$SOURCE_DIR/$file"
          done
          python scripts/extract_jamb_syllabus_sources.py --source-dir "$SOURCE_DIR" --output-dir "$OUTPUT_DIR"

      - name: Upload extracted JAMB syllabus review pack
        uses: actions/upload-artifact@v4
        with:
          name: jamb-syllabus-source-extraction
          path: artifacts/jamb-syllabus/
          if-no-files-found: error
          retention-days: 7

      - name: Test JAMB syllabus extraction
        run: python -m unittest scripts.test_jamb_syllabus_sources

      - name: Test question-source importer against fixtures and committed JAMB content
        run: python -m unittest scripts.test_import_jamb_sources

      - name: Generate review-only JAMB question packages
        run: |
          python scripts/import_jamb_sources.py --out-dir artifacts/jamb-question-import
          mkdir -p artifacts/jamb-question-import/original-sources
          cp Physics.txt Chemistry.txt Biology.txt JAMB_english_READABLE.txt artifacts/jamb-question-import/original-sources/
          cat > artifacts/jamb-question-import/README.txt <<'EOF'
          JAMB SOURCE INTAKE BUNDLE
          
          Contents:
          - physics.json
          - chemistry.json
          - biology.json
          - use_of_english.json
          - import-audit.json
          - original-sources/: the exact four source documents used to generate the JSON
          
          Use each JSON only with its exact matching original source document in
          /admin/jamb-questions -> Source Import & Review. The admin uploader verifies
          the source SHA-256 before staging. Record the permission note and complete
          the rights confirmation in the admin page.
          
          All candidates are review-only. Do not publish automatically. English
          source-provided answers/explanations remain unverified suggestions, and
          all science answer keys/explanations require independent human review.
          EOF

      - name: Upload temporary JAMB source intake bundle
        uses: actions/upload-artifact@v4
        with:
          name: jamb-source-intake-bundle
          path: artifacts/jamb-question-import/
          if-no-files-found: error
          retention-days: 3

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Test programme entitlement, retrieval, CBT scoring and JAMB import recovery
        run: deno test supabase/functions/_shared/trial-access.test.ts supabase/functions/_shared/question-retrieve.test.ts supabase/functions/_shared/exam-scoring.test.ts supabase/functions/_shared/jamb-import-range.test.ts supabase/functions/_shared/jamb-review-validation.test.ts supabase/functions/_shared/jamb-source-reference.test.ts supabase/functions/_shared/jamb-import-answer-suggestions.test.ts supabase/functions/_shared/jamb-question-visibility.test.ts supabase/functions/_shared/jamb-answer-draft.test.ts

      - name: Type-check JAMB Edge Functions
        run: deno check supabase/functions/_shared/ai.ts supabase/functions/_shared/exam-access.ts supabase/functions/_shared/trial-access.ts supabase/functions/_shared/exam-scoring.ts supabase/functions/ai-tutor/index.ts supabase/functions/chat-proxy/index.ts supabase/functions/parse-document/index.ts supabase/functions/question-import/index.ts supabase/functions/exam-attempts/index.ts supabase/functions/exam-practice/index.ts

      - name: Validate Firebase Android client
        run: |
          test -s android/app/google-services.json
          python3 - <<'PY'
          import json
          with open("android/app/google-services.json", encoding="utf-8") as source:
              config = json.load(source)
          packages = {
              item.get("client_info", {}).get("android_client_info", {}).get("package_name")
              for item in config.get("client", [])
          }
          assert "com.jupeb.master" in packages, "Firebase config must include Android package com.jupeb.master"
          print("Firebase Android client config validated.")
          PY

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build web app
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          VITE_SUPABASE_URL: "https://gzyczowqqywesqhqqpdi.supabase.co"
          VITE_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_GVQs-O9yijr0XIbB6cVvEw_pvQyFXbX"
          VITE_SUPABASE_PROJECT_ID: "gzyczowqqywesqhqqpdi"
          VITE_ADMIN_EMAIL: "abdulrazaqafolarin@gmail.com"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Compile Android debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          (cd android && ./gradlew assembleDebug --no-daemon)
