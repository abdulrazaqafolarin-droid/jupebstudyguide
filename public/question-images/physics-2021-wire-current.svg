<svg xmlns="http://www.w3.org/2000/svg" width="800" height="510" viewBox="0 0 800 510">
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172033}.title{font-size:25px;font-weight:700}.sub{font-size:13px;fill:#46536a}.wire{stroke:#172033;stroke-width:3.5;fill:none;stroke-linejoin:round}.current{stroke:#1d4ed8;stroke-width:3;fill:none}.label{font-size:17px;font-weight:700}.small{font-size:13px;fill:#536176}</style>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6Z" fill="#1d4ed8"/></marker></defs>
<rect width="800" height="510" fill="white"/>
<text x="28" y="38" class="title">2021 Physics Theory — Question 8(b)</text>
<text x="28" y="62" class="sub">Parallel branches: 10 Ω uniform wire AB and 4 Ω + 2 Ω series resistors • schematic of the paper's figure</text>
<!-- supply and outer return -->
<path class="wire" d="M100 130V225 M100 130H310 M410 130H650V225 M650 275V390H100V275"/>
<path class="wire" d="M310 108V152 M410 118V142"/>
<text x="344" y="95" class="label">12 V</text>
<!-- wire AB -->
<path class="wire" d="M100 250H650"/>
<text x="82" y="253" class="label">A</text><text x="662" y="253" class="label">B</text>
<text x="320" y="224" class="label">Uniform metal wire AB</text>
<text x="330" y="242" class="small">1.00 m • 10 Ω</text>
<!-- point C -->
<circle cx="320" cy="250" r="5" fill="#dc2626"/>
<text x="308" y="280" class="label">C</text>
<path d="M100 292V305H320V292" stroke="#64748b" stroke-width="1.5" fill="none"/>
<text x="175" y="327" class="small">AC = 40 cm</text>
<!-- lower series branch from A to B -->
<path class="wire" d="M100 250V390 M650 250V390"/>
<rect x="195" y="373" width="120" height="34" fill="white" stroke="#172033" stroke-width="3"/>
<text x="238" y="365" class="label">4.0 Ω</text>
<path class="wire" d="M315 390H410"/>
<circle cx="410" cy="390" r="4" fill="#dc2626"/>
<text x="401" y="425" class="label">D</text>
<rect x="455" y="373" width="120" height="34" fill="white" stroke="#172033" stroke-width="3"/>
<text x="498" y="365" class="label">2.0 Ω</text>
<path class="wire" d="M410 390H455 M575 390H650"/>
<!-- current arrows -->
<path class="current" d="M100 165V210" marker-end="url(#arrow)"/>
<text x="65" y="180" class="label">I₁</text>
<path class="current" d="M155 250H220" marker-end="url(#arrow)"/>
<text x="170" y="238" class="label">I₂</text>
<path class="current" d="M100 295V345" marker-end="url(#arrow)"/>
<text x="65" y="325" class="label">I₃</text>
<text x="28" y="470" class="small">I₁ = I₂ + I₃. From the circuit values: I₂ = 12/10 = 1.2 A; I₃ = 12/(4 + 2) = 2.0 A; I₁ = 3.2 A.</text>
</svg>