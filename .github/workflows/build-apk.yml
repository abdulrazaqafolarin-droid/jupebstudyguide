name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      allow_signing_key_migration:
        description: "DANGEROUS: authorize a different signing key and required uninstall. This can erase device-only study progress/bookmarks from the old app."
        required: false
        default: false
        type: boolean
      confirm_legacy_device_data_loss:
        description: "SECOND REQUIRED ACKNOWLEDGEMENT: explicitly accept permanent loss of device-only data on existing legacy installations. Do not select unless the owner has approved and students have been informed."
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Validate Firebase Android client
        shell: bash
        run: |
          set -euo pipefail
          test -s android/app/google-services.json
          python3 - <<'PY'
          import json
          with open("android/app/google-services.json", encoding="utf-8") as source:
              config = json.load(source)
          packages = {
              item.get("client_info", {}).get("android_client_info", {}).get("package_name")
              for item in config.get("client", [])
          }
          assert "com.jupeb.master" in packages, "Firebase config must include Android package com.jupeb.master"
          print("Firebase Android client config validated.")
          PY

      - name: Install npm dependencies
        run: npm ci

      - name: Build web app
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          VITE_SUPABASE_URL: "https://gzyczowqqywesqhqqpdi.supabase.co"
          VITE_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_GVQs-O9yijr0XIbB6cVvEw_pvQyFXbX"
          VITE_SUPABASE_PROJECT_ID: "gzyczowqqywesqhqqpdi"
          VITE_ADMIN_EMAIL: "abdulrazaqafolarin@gmail.com"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build signed release APK or isolated debug preview
        id: build-apk
        shell: bash
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          export APK_VERSION_CODE="$GITHUB_RUN_NUMBER"
          export APK_VERSION_NAME="1.1.$GITHUB_RUN_NUMBER"

          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/ci-release-key.jks
            export ANDROID_KEYSTORE_PATH="$GITHUB_WORKSPACE/android/app/ci-release-key.jks"
            (cd android && ./gradlew assembleRelease --no-daemon)
            echo "APK_PATH=android/app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"
            echo "signing-mode=stable" >> "$GITHUB_OUTPUT"
            echo "Built release APK with the configured persistent signing key."
          else
            # The owner explicitly approved a clean reinstall and loss of
            # device-only state. Keep the normal app ID, but sign this one-time
            # fresh install with the new CI debug key. It is artifact-only.
            mkdir -p android/app/src/debug/res/values
            cat > android/app/src/debug/res/values/strings.xml <<'XML'
          <resources>
              <string name="app_name">JUPEB Master</string>
              <string name="title_activity_main">JUPEB Master</string>
              <string name="package_name">com.jupeb.master</string>
              <string name="custom_url_scheme">com.jupeb.master</string>
          </resources>
          XML
            echo "::warning title=Fresh JUPEB installation::This clean-install APK uses a new signing certificate. Uninstall the previous JUPEB Master app before installing it. Device-only data in the old app will be removed; the fresh APK is not published to the in-app updater."
            (cd android && ./gradlew assembleDebug --no-daemon)
            cp android/app/build/outputs/apk/debug/app-debug.apk jupeb-master-fresh-install.apk
            echo "APK_PATH=jupeb-master-fresh-install.apk" >> "$GITHUB_ENV"
            echo "signing-mode=debug-candidate" >> "$GITHUB_OUTPUT"
            echo "expected-package=com.jupeb.master" >> "$GITHUB_OUTPUT"
          fi
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Verify fresh-install package identity
        if: steps.build-apk.outputs.signing-mode == 'debug-candidate'
        shell: bash
        env:
          EXPECTED_PACKAGE: ${{ steps.build-apk.outputs.expected-package }}
        run: |
          set -euo pipefail
          PACKAGE="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK_PATH" | awk -F"'" '/^package:/{print $2; exit}')"
          if [ "$PACKAGE" != "$EXPECTED_PACKAGE" ]; then
            echo "::error::Expected package $EXPECTED_PACKAGE, got '$PACKAGE'"
            exit 1
          fi
          echo "Fresh-install package verified: $PACKAGE"

      - name: Verify signing compatibility with the currently published APK
        id: update-signing
        shell: bash
        env:
          ALLOW_SIGNING_KEY_MIGRATION: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_signing_key_migration }}
          CONFIRM_LEGACY_DEVICE_DATA_LOSS: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_legacy_device_data_loss }}
          SIGNING_MODE: ${{ steps.build-apk.outputs.signing-mode }}
        run: |
          set -euo pipefail
          echo "requires-reinstall=false" >> "$GITHUB_OUTPUT"
          if [ "$SIGNING_MODE" != "stable" ]; then
            echo "compatible=false" >> "$GITHUB_OUTPUT"
            echo "Preview/debug candidates are never eligible for the production updater or GitHub release."
            exit 0
          fi
          APK="$APK_PATH"
          PREVIOUS_APK_URL="https://gzyczowqqywesqhqqpdi.supabase.co/storage/v1/object/public/app-releases/jupeb-master.apk"
          PREVIOUS_APK="$RUNNER_TEMP/previous-jupeb-master.apk"

          if ! curl --retry 2 --retry-all-errors --connect-timeout 10 --max-time 60 -fsS "$PREVIOUS_APK_URL" -o "$PREVIOUS_APK"; then
            echo "compatible=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Update compatibility not verified::The previous public APK could not be downloaded for signing comparison. This build will be kept as an artifact but not advertised as an in-place update."
            exit 0
          fi

          CURRENT_SIGNER_REPORT="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" 2>&1 || true)"
          PREVIOUS_SIGNER_REPORT="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$PREVIOUS_APK" 2>&1 || true)"
          CURRENT_CERT="$(echo "$CURRENT_SIGNER_REPORT" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print $2; exit}' | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          PREVIOUS_CERT="$(echo "$PREVIOUS_SIGNER_REPORT" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print $2; exit}' | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"

          if [ -z "$CURRENT_CERT" ] || [ -z "$PREVIOUS_CERT" ]; then
            echo "compatible=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=APK signer could not be verified::A signer certificate could not be read from the new or currently published APK. This build will not be published as an in-place update."
          elif [ "$CURRENT_CERT" = "$PREVIOUS_CERT" ]; then
            echo "compatible=true" >> "$GITHUB_OUTPUT"
            echo "APK signer matches the currently published installation."
          elif [ "$ALLOW_SIGNING_KEY_MIGRATION" = "true" ] && [ "$CONFIRM_LEGACY_DEVICE_DATA_LOSS" = "true" ]; then
            echo "compatible=true" >> "$GITHUB_OUTPUT"
            echo "requires-reinstall=true" >> "$GITHUB_OUTPUT"
            echo "::warning title=Destructive migration explicitly approved::The owner has explicitly acknowledged that uninstalling the legacy APK may permanently remove device-only study records. Publish only after the student notification and support plan are ready."
          else
            echo "compatible=false" >> "$GITHUB_OUTPUT"
            if [ "$ALLOW_SIGNING_KEY_MIGRATION" = "true" ]; then
              echo "::warning title=Signing migration remains blocked::Both allow_signing_key_migration and confirm_legacy_device_data_loss must be checked before the new signing key can be published. The candidate APK will remain an artifact only."
            else
              echo "::warning title=APK signing key mismatch::The candidate APK is signed with a different certificate from the currently published APK. It will remain an artifact and will not be advertised as an in-place update."
            fi
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jupeb-master-fresh-install
          path: ${{ env.APK_PATH }}

      - name: Mirror APK + version file to public storage
        if: github.ref == 'refs/heads/main' && steps.build-apk.outputs.signing-mode == 'stable' && steps.update-signing.outputs.compatible == 'true'
        env:
          SUPABASE_URL: "https://gzyczowqqywesqhqqpdi.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REQUIRES_REINSTALL: ${{ steps.update-signing.outputs.requires-reinstall }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY is required to publish the Android updater release. No GitHub release will be created."
            exit 1
          fi
          APK="$APK_PATH"
          if [ ! -f "$APK" ]; then echo "APK output missing: $APK"; exit 1; fi
          BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          APK_SHA256=$(sha256sum "$APK" | cut -d ' ' -f1)
          case "$REQUIRES_REINSTALL" in
            true) REINSTALL_JSON=true ;;
            false|"") REINSTALL_JSON=false ;;
            *) echo "::error::Invalid requires-reinstall release flag"; exit 1 ;;
          esac
          printf '{"versionCode":%s,"versionName":"%s","commit":"%s","builtAt":"%s","url":"%s/storage/v1/object/public/app-releases/jupeb-master.apk","sha256":"%s","requiresReinstall":%s}' "$GITHUB_RUN_NUMBER" "1.1.$GITHUB_RUN_NUMBER" "$GITHUB_SHA" "$BUILT_AT" "$SUPABASE_URL" "$APK_SHA256" "$REINSTALL_JSON" > version.json
          python3 - "$APK" version.json "$APK_SHA256" "$SUPABASE_URL" <<'PY'
          import hashlib
          import json
          import re
          import sys
          apk_path, metadata_path, expected_hash, supabase_url = sys.argv[1:]
          with open(metadata_path, encoding="utf-8") as f:
              metadata = json.load(f)
          actual_hash = hashlib.sha256()
          with open(apk_path, "rb") as f:
              for chunk in iter(lambda: f.read(1024 * 1024), b""):
                  actual_hash.update(chunk)
          digest = actual_hash.hexdigest()
          expected_url = f"{supabase_url.rstrip('/')}/storage/v1/object/public/app-releases/jupeb-master.apk"
          assert isinstance(metadata.get("versionCode"), int) and metadata["versionCode"] > 0
          assert metadata.get("url") == expected_url
          assert isinstance(metadata.get("sha256"), str) and re.fullmatch(r"[a-fA-F0-9]{64}", metadata["sha256"])
          assert metadata["sha256"].lower() == digest == expected_hash.lower()
          print(f"Verified release metadata for version {metadata['versionCode']} ({digest})")
          PY
          curl -sS --fail-with-body -X POST "$SUPABASE_URL/storage/v1/object/app-releases/jupeb-master.apk" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Content-Type: application/vnd.android.package-archive" -H "x-upsert: true" --data-binary "@$APK"
          curl -sS --fail-with-body -X POST "$SUPABASE_URL/storage/v1/object/app-releases/version.json" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Content-Type: application/json" -H "x-upsert: true" --data-binary "@version.json"
          PUBLISHED_VERSION_URL="$SUPABASE_URL/storage/v1/object/public/app-releases/version.json"
          curl --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30 -sS --fail-with-body "$PUBLISHED_VERSION_URL" -o published-version.json
          python3 - "$APK" published-version.json "$APK_SHA256" "$SUPABASE_URL" <<'PY'
          import hashlib, json, re, sys
          apk_path, metadata_path, expected_hash, supabase_url = sys.argv[1:]
          with open(metadata_path, encoding="utf-8") as f:
              metadata = json.load(f)
          with open(apk_path, "rb") as f:
              actual_hash = hashlib.file_digest(f, "sha256").hexdigest()
          expected_url = f"{supabase_url.rstrip('/')}/storage/v1/object/public/app-releases/jupeb-master.apk"
          assert metadata.get("url") == expected_url
          assert re.fullmatch(r"[a-fA-F0-9]{64}", metadata.get("sha256", ""))
          assert metadata["sha256"].lower() == actual_hash == expected_hash.lower()
          print(f"Public metadata verified for version {metadata['versionCode']}")
          PY
          APK_HTTP_STATUS=$(curl --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30 -sS -o /dev/null -w "%{http_code}" -I "$SUPABASE_URL/storage/v1/object/public/app-releases/jupeb-master.apk")
          echo "Published APK HTTP status: $APK_HTTP_STATUS"
          test "$APK_HTTP_STATUS" = "200"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: steps.build-apk.outputs.signing-mode == 'stable' && steps.update-signing.outputs.compatible == 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        with:
          tag_name: android-latest
          name: "Android APK (latest)"
          files: ${{ env.APK_PATH }}
